---
layout: default
---
<section class="hero">
  <p class="kicker">{{ page.kicker }}</p>
  <h1>{{ page.display_name }}</h1>
  <div class="prose">{{ content }}</div>
  <div class="home-links">
    {% if page.lang == "fa" %}
      <a class="button" href="{{ '/fa/books/' | relative_url }}">کتاب‌ها</a>
      <a class="button button-secondary" href="{{ '/fa/publications/' | relative_url }}">نوشته‌ها</a>
      <a class="button button-secondary" href="{{ '/fa/about/' | relative_url }}">درباره</a>
    {% else %}
      <a class="button" href="{{ '/en/books/' | relative_url }}">Books</a>
      <a class="button button-secondary" href="{{ '/en/publications/' | relative_url }}">Publications</a>
      <a class="button button-secondary" href="{{ '/en/about/' | relative_url }}">About</a>
    {% endif %}
  </div>
</section>
