<header class="site-header">
  <div class="shell header-inner">
    <a class="site-name" href="{% if page.lang == 'fa' %}{{ '/fa/' | relative_url }}{% else %}{{ '/en/' | relative_url }}{% endif %}">
      {% if page.lang == "fa" %}غلام‌رضا عمرانی{% else %}GHOLAMREZA EMRANI{% endif %}
    </a>

    <nav class="main-nav" aria-label="Primary">
      {% if page.lang == "fa" %}
        <a href="{{ '/fa/' | relative_url }}#about">درباره</a>
        <a href="{{ '/fa/works/' | relative_url }}">آثار</a>
        <a href="{{ '/fa/sistan/' | relative_url }}">مجموعهٔ سیستان</a>
        <a href="{{ '/fa/' | relative_url }}#interviews">گفت‌وگوها</a>
        <a href="{{ '/fa/' | relative_url }}#contact">تماس</a>
      {% else %}
        <a href="{{ '/en/' | relative_url }}#about">About</a>
        <a href="{{ '/en/works/' | relative_url }}">Works</a>
        <a href="{{ '/en/sistan/' | relative_url }}">Sistan Series</a>
        <a href="{{ '/en/' | relative_url }}#interviews">Interviews</a>
        <a href="{{ '/en/' | relative_url }}#contact">Contact</a>
      {% endif %}
    </nav>

    <div class="language-switch" aria-label="Language">
      {% if page.lang == "fa" %}
        <a href="{{ page.translation_url | default: '/en/' | relative_url }}" lang="en" dir="ltr">EN</a>
        <span aria-hidden="true">/</span>
        <strong lang="fa" dir="rtl">فا</strong>
      {% else %}
        <strong lang="en" dir="ltr">EN</strong>
        <span aria-hidden="true">/</span>
        <a href="{{ page.translation_url | default: '/fa/' | relative_url }}" lang="fa" dir="rtl">فا</a>
      {% endif %}
    </div>
  </div>
</header>
